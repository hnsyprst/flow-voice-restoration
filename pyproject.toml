[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[project]
name = "flow-voice-restoration"
version = "0.1.0"
description = "Research repository for voice restoration via flow matching."
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "flash-attn>=2.8.3",
    "hydra-core==1.3.2",
    "lightning==2.6.1",
    "mlflow>=3.10.1",
    "numpy==2.4.2",
    "omegaconf==2.3.0",
    "peft>=0.20.0",
    "pyroomacoustics==0.10.1",
    "rich>=14.3.3",
    "rootutils>=1.0.7",
    "soundfile==0.13.1",
    "soxr==1.0.0",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchcodec==0.10.0",
    "torchmetrics>=1.8.2",
    "transformers==5.13.0",
    "vae",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.8",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "ruff>=0.15.4",
    "ty==0.0.81",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # naming conventions
    "N",
]

[tool.ty.environment]
root = ["./src"]
python = ".venv"

[tool.uv]
environments = ["sys_platform == 'linux'"]
override-dependencies = [
    "stable-audio-tools; sys_platform == 'never'",
]

[tool.uv.sources]
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.0/flash_attn-2.8.3%2Bcu128torch2.10-cp312-cp312-linux_x86_64.whl" }
vae = { git = "https://github.com/hnsyprst/vae", rev = "add-same" }
