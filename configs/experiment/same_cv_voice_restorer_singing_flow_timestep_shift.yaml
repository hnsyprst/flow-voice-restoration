# @package _global_

defaults:
  - base/same_cv_voice_restorer_singing_flow
  - _self_

run_name: same_cv_voice_restorer_singing_flow_timestep_shift
description: "Flow-matching restoration over SAME-S latents, singing corpus: DiT velocity model conditioned on warm-started encoder features. CFG dropout 10%, logit-normal timesteps with RAE's dimension-dependent shift (base dimension 4096). Uses the content-vec distilled generative-aligned SAME-S checkpoint."

trainer:
  devices: 2
  accumulate_grad_batches: 8

data:
  batch_size: 16

callbacks:
  model_checkpoint:
    dirpath: ${paths.data_dir}/voice-restoration-ckpts/${run_name}_${now:%Y-%m-%d}_${now:%H-%M-%S}
  on_exception_checkpoint:
    dirpath: ${paths.data_dir}/voice-restoration-ckpts/${run_name}_${now:%Y-%m-%d}_${now:%H-%M-%S}
