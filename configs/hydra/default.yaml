# https://hydra.cc/docs/configure_hydra/intro/

# enable rich logging
defaults:
  - override job_logging: custom

# output directory, generated dynamically on each run
run:
  dir: ${paths.log_dir}/${task_name}/runs/${run_name}_${now:%Y-%m-%d}_${now:%H-%M-%S}
sweep:
  dir: ${paths.log_dir}/${task_name}/multiruns/${run_name}_${now:%Y-%m-%d}_${now:%H-%M-%S}
  subdir: ${hydra.job.num}